services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crunchify_dev
      POSTGRES_USER: crunchify_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - crunchify_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crunchify_dev -d crunchify_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crunchify_dev_data:
